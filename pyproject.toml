[project]
name = "bartolo"
version = "3.0.0"
description = "Bartolo: auditorias internas ISO 50001:2018, del plan a la agenda, la ejecucion y el informe en .docx"
readme = "README.md"
requires-python = ">=3.11"

# Versiones fijadas a las que llevaban funcionando en Tambora_servidor (su
# uv.lock). Mover la herramienta a su propio proyecto no deberia cambiar de
# paso todo el stack: con las ultimas, `langsmith.wrap_anthropic` revienta
# contra el cliente nuevo de anthropic ("'Anthropic' object has no attribute
# 'completions'") y starlette >=1.6 cambia la forma de `app.routes`.
# Para subir algo, subelo a proposito y pasa la suite.
dependencies = [
    # LLM
    "anthropic==0.96.0",
    "langsmith==0.7.33",
    # Servidor y plantillas
    "fastapi==0.136.0",
    "uvicorn[standard]==0.44.0",
    "jinja2==3.1.4",
    "python-multipart==0.0.26",
    "httpx==0.28.1",
    # Auth y persistencia
    # authlib e itsdangerous entran con el SSO (2026-09-15): el baile OIDC
    # guarda su state en request.session, lo que exige el SessionMiddleware de
    # starlette, y ese necesita itsdangerous. Mismas versiones que PALBE, el
    # recibidor y Tambora contra este Keycloak 26.
    "authlib==1.8.0",
    "itsdangerous==2.2.0",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "aiosqlite==0.22.1",
    # Exportacion .docx (plan e informe) sobre las plantillas de referencia
    "python-docx==1.2.0",
    "lxml==6.1.0",
    # Capturas adjuntas a las clausulas
    "pillow==12.2.0",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.11",
    "black==26.3.1",
    "pyright>=1.1.390",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
norecursedirs = [
    ".venv",
    ".claude",
    ".ruff_cache",
    ".pytest_cache",
    "data",
    "__pycache__",
]
asyncio_mode = "auto"

[tool.ruff]
exclude = [
    ".venv",
    ".ruff_cache",
    ".pytest_cache",
    "data",
]
